
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGRUCOL E.S.P. - Animación de píxeles</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #ffffff;
  font-family: Arial, sans-serif;
}

.contenedor {
  width: 100%;
  max-width: 1100px;
  margin: auto;
  padding: 10px;
  text-align: center;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  background: #ffffff;
}

.titulo {
  color: #26723b;
  font-size: 20px;
  font-weight: bold;
  margin: 10px 0;
}
</style>
</head>
<body>
<div class="contenedor">
  <div class="titulo">AGRUCOL E.S.P.</div>
  <canvas id="lienzo" width="960" height="540"></canvas>
</div>

<script>
const canvas = document.getElementById("lienzo");
const ctx = canvas.getContext("2d");

const rutas = [
  "images/foto1.jpg",
  "images/foto2.jpg",
  "images/foto3.jpg",
  "images/foto4.jpg",
  "images/foto5.jpg",
  "images/foto6.jpg",
  "images/foto7.jpg"
];

const imagenes = [];
let indice = 0;
let particulas = [];
let fase = "formar";
let inicio = performance.now();

const columnas = 120;
const filas = 68;
const anchoPixel = canvas.width / columnas;
const altoPixel = canvas.height / filas;

const tiempos = {
  formar: 1800,
  mostrar: 1800,
  dispersar: 1200
};

function cargarImagen(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

async function iniciar() {
  for (const ruta of rutas) {
    const img = await cargarImagen(ruta);
    if (img) imagenes.push(img);
    else console.error("No se pudo cargar:", ruta);
  }

  if (imagenes.length === 0) {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#26723b";
    ctx.font = "bold 26px Arial";
    ctx.textAlign = "center";
    ctx.fillText("No se encontraron las fotos", 480, 260);
    return;
  }

  prepararFoto();
  requestAnimationFrame(animar);
}

function prepararFoto() {
  const img = imagenes[indice];
  const mini = document.createElement("canvas");
  mini.width = columnas;
  mini.height = filas;
  const mctx = mini.getContext("2d", {
    willReadFrequently: true
  });

  // Ajusta la fotografía para que se vea completa.
  const escala = Math.min(
    columnas / img.width,
    filas / img.height
  );
  const w = img.width * escala;
  const h = img.height * escala;
  const x = (columnas - w) / 2;
  const y = (filas - h) / 2;

  mctx.fillStyle = "#ffffff";
  mctx.fillRect(0, 0, columnas, filas);
  mctx.drawImage(img, x, y, w, h);

  const datos = mctx.getImageData(
    0, 0, columnas, filas
  ).data;

  particulas = [];

  for (let py = 0; py < filas; py++) {
    for (let px = 0; px < columnas; px++) {
      const k = (py * columnas + px) * 4;
      const angulo = Math.random() * Math.PI * 2;
      const distancia = 200 + Math.random() * 500;

      particulas.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        destinoX: px * anchoPixel,
        destinoY: py * altoPixel,
        color: `rgb(${datos[k]},${datos[k+1]},${datos[k+2]})`,
        salidaX: Math.cos(angulo) * distancia,
        salidaY: Math.sin(angulo) * distancia,
        tamano: Math.max(anchoPixel, altoPixel) + 0.5
      });
    }
  }

  fase = "formar";
  inicio = performance.now();
}

function animar(ahora) {
  const duracion = tiempos[fase];
  const progreso = Math.min(1, (ahora - inicio) / duracion);
  const suave = progreso * progreso * (3 - 2 * progreso);

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (const p of particulas) {
    let x, y, alpha = 1;

    if (fase === "formar") {
      x = p.x + (p.destinoX - p.x) * suave;
      y = p.y + (p.destinoY - p.y) * suave;
    } else if (fase === "mostrar") {
      x = p.destinoX;
      y = p.destinoY;
    } else {
      x = p.destinoX + p.salidaX * suave;
      y = p.destinoY + p.salidaY * suave;
      alpha = 1 - suave;
    }

    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(x, y, p.tamano, p.tamano);
  }

  ctx.globalAlpha = 1;

  if (progreso >= 1) {
    if (fase === "formar") {
      fase = "mostrar";
    } else if (fase === "mostrar") {
      fase = "dispersar";
    } else {
      indice = (indice + 1) % imagenes.length;
      prepararFoto();
    }
    inicio = ahora;
  }

  requestAnimationFrame(animar);
}

iniciar();
</script>
</body>
</html>
